<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withiv — Панель управления</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand_dark: '#1B3B2B',
                        brand_bg: '#F7F4EF',
                        brand_accent: '#C59B27'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand_bg text-brand_dark min-h-screen font-sans antialiased">

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full border border-brand_dark/10">
            <h1 class="text-2xl font-bold text-center mb-2">WITHIV ADMIN</h1>
            <p class="text-xs text-center text-brand_dark/60 mb-6">Управление турами и отзывами</p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">Пароль доступа</label>
                    <input type="password" id="admin-pass-input" required placeholder="Введите пароль" class="w-full px-4 py-3 border border-brand_dark/20 rounded focus:outline-none focus:border-brand_dark">
                </div>
                <button type="submit" class="w-full py-3 bg-brand_dark text-white font-semibold rounded hover:bg-brand_dark/90 transition">Войти</button>
            </form>
        </div>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ -->
    <div id="admin-panel" class="hidden max-w-4xl mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center pb-6 border-b border-brand_dark/10 mb-8">
            <div>
                <h1 class="text-2xl font-bold">Панель управления Withiv</h1>
                <p class="text-xs text-brand_dark/60">Все изменения сразу появляются на сайте</p>
            </div>
            <button onclick="logout()" class="text-xs font-semibold text-red-600 hover:underline">Выйти</button>
        </header>

        <!-- ВКЛАДКИ -->
        <div class="flex gap-4 mb-8">
            <button onclick="switchTab('tours')" id="tab-btn-tours" class="px-5 py-2.5 bg-brand_dark text-white text-sm font-semibold rounded transition">Интересные предложения</button>
            <button onclick="switchTab('reviews')" id="tab-btn-reviews" class="px-5 py-2.5 bg-white text-brand_dark border border-brand_dark/20 text-sm font-semibold rounded transition">Отзывы</button>
        </div>

        <!-- РАЗДЕЛ: ТУРЫ -->
        <div id="section-tours" class="space-y-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-brand_dark/10">
                <h2 class="text-lg font-bold mb-4">Добавить новое предложение</h2>
                <form id="add-tour-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Название отеля / тура *</label>
                            <input type="text" id="tour-title" required placeholder="Например: Rixos Premium Belek 5*" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Страна и курорт *</label>
                            <input type="text" id="tour-location" required placeholder="Например: Турция, Белек" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Цена *</label>
                            <input type="text" id="tour-price" required placeholder="Например: от 245 000 ₽" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Краткие детали (плашка)</label>
                            <input type="text" id="tour-details" placeholder="7 ночей • Ультра всё включено • Вылет из Казани" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Подробное описание</label>
                        <textarea id="tour-desc" rows="3" placeholder="Почему стоит выбрать этот отель, особенности пляжа, фишки..." class="w-full px-3 py-2 border border-brand_dark/20 rounded"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Фотография отеля *</label>
                        <input type="file" id="tour-photo-file" accept="image/*" required class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-brand_dark file:text-white hover:file:bg-brand_dark/90">
                        <p class="text-[11px] text-brand_dark/50 mt-1">Фото автоматически сожмется для быстрой загрузки сайта</p>
                    </div>
                    <button type="submit" id="tour-submit-btn" class="px-6 py-3 bg-brand_accent text-white font-bold rounded hover:opacity-90 transition">Опубликовать тур</button>
                </form>
            </div>

            <!-- СПИСОК ТЕКУЩИХ ТУРОВ -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-brand_dark/10">
                <h3 class="text-base font-bold mb-4">Текущие предложения на сайте</h3>
                <div id="admin-tours-list" class="space-y-3 text-sm text-brand_dark/70">Загрузка...</div>
            </div>
        </div>

        <!-- РАЗДЕЛ: ОТЗЫВЫ -->
        <div id="section-reviews" class="hidden space-y-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-brand_dark/10">
                <h2 class="text-lg font-bold mb-4">Добавить отзыв клиента</h2>
                <form id="add-review-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Имя клиента *</label>
                            <input type="text" id="rev-name" required placeholder="Например: Елена и Сергей" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Куда летали (страна)</label>
                            <input type="text" id="rev-location" placeholder="Например: Дагестан" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Дата написания</label>
                            <input type="text" id="rev-date" placeholder="Например: 15.11.2026" class="w-full px-3 py-2 border border-brand_dark/20 rounded">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Текст отзыва *</label>
                        <textarea id="rev-text" rows="3" required placeholder="Вставьте текст отзыва..." class="w-full px-3 py-2 border border-brand_dark/20 rounded"></textarea>
                    </div>
                    <button type="submit" id="rev-submit-btn" class="px-6 py-3 bg-brand_accent text-white font-bold rounded hover:opacity-90 transition">Опубликовать отзыв</button>
                </form>
            </div>

            <!-- СПИСОК ТЕКУЩИХ ОТЗЫВОВ -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-brand_dark/10">
                <h3 class="text-base font-bold mb-4">Текущие отзывы на сайте</h3>
                <div id="admin-reviews-list" class="space-y-3 text-sm text-brand_dark/70">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyfm98Wbr_Mwar3n8924oXOSQ1ZwVMg2jB_Ik1d_kULMANbzj332Odu2D9R6w0b4ts/exec';
        const CLOUDINARY_CLOUD_NAME = 'g9u4par5';
        const CLOUDINARY_UPLOAD_PRESET = 'withiv_preset';

        let adminPassword = localStorage.getItem('withiv_admin_pass') || '';

        if (adminPassword) {
            showPanel();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const passInput = document.getElementById('admin-pass-input').value.trim();
            const origText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Проверка...';

            try {
                adminPassword = passInput;
                await postToGAS({ action: 'auth' });
                localStorage.setItem('withiv_admin_pass', adminPassword);
                showPanel();
            } catch (err) {
                adminPassword = '';
                if (err.message !== 'Unauthorized') alert('Ошибка сети: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = origText;
            }
        });

        function logout() {
            localStorage.removeItem('withiv_admin_pass');
            location.reload();
        }

        function showPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            loadAdminData();
        }

        function switchTab(tab) {
            const isTours = tab === 'tours';
            document.getElementById('section-tours').classList.toggle('hidden', !isTours);
            document.getElementById('section-reviews').classList.toggle('hidden', isTours);

            document.getElementById('tab-btn-tours').className = isTours
                ? 'px-5 py-2.5 bg-brand_dark text-white text-sm font-semibold rounded transition'
                : 'px-5 py-2.5 bg-white text-brand_dark border border-brand_dark/20 text-sm font-semibold rounded transition';
            document.getElementById('tab-btn-reviews').className = !isTours
                ? 'px-5 py-2.5 bg-brand_dark text-white text-sm font-semibold rounded transition'
                : 'px-5 py-2.5 bg-white text-brand_dark border border-brand_dark/20 text-sm font-semibold rounded transition';
        }

        async function postToGAS(payload) {
            const res = await fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ ...payload, password: adminPassword })
            });
            const data = await res.json();
            if (data.status === 401) {
                alert('Неверный пароль!');
                if (localStorage.getItem('withiv_admin_pass')) logout();
                throw new Error('Unauthorized');
            }
            if (!data.ok) {
                throw new Error(data.error || 'Ошибка скрипта Google');
            }
            return data;
        }

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                    resolve(file);
                    return;
                }

                const timeout = setTimeout(() => resolve(file), 3000);
                const reader = new FileReader();
                reader.onerror = () => { clearTimeout(timeout); resolve(file); };
                reader.readAsDataURL(file);

                reader.onload = (event) => {
                    const img = new Image();
                    img.onerror = () => { clearTimeout(timeout); resolve(file); };
                    img.src = event.target.result;

                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            canvas.toBlob((blob) => {
                                clearTimeout(timeout);
                                resolve(blob || file);
                            }, 'image/jpeg', quality);
                        } catch (e) {
                            clearTimeout(timeout);
                            resolve(file);
                        }
                    };
                };
            });
        }

        async function uploadToCloudinary(file) {
            const fileToUpload = await compressImage(file);
            const formData = new FormData();
            formData.append('file', fileToUpload);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error?.message || `Ошибка Cloudinary (${res.status})`);
            }
            return data.secure_url;
        }

        document.getElementById('add-tour-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('tour-submit-btn');
            const origText = btn.innerText;
            btn.disabled = true;

            try {
                btn.innerText = 'Сжимаем и грузим фото...';
                const file = document.getElementById('tour-photo-file').files[0];
                const photoUrl = await uploadToCloudinary(file);

                btn.innerText = 'Сохраняем в таблицу...';
                const row = [
                    document.getElementById('tour-title').value.trim(),
                    document.getElementById('tour-location').value.trim(),
                    document.getElementById('tour-price').value.trim(),
                    document.getElementById('tour-details').value.trim(),
                    document.getElementById('tour-desc').value.trim(),
                    photoUrl,
                    'both'
                ];

                await postToGAS({ action: 'tour_add', row });

                alert('Тур успешно опубликован!');
                e.target.reset();
                loadAdminData();
            } catch (err) {
                if (err.message !== 'Unauthorized') alert('Ошибка: ' + err.message);
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        });

        document.getElementById('add-review-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('rev-submit-btn');
            btn.disabled = true;
            btn.innerText = 'Публикация...';

            try {
                const row = [
                    document.getElementById('rev-name').value.trim(),
                    document.getElementById('rev-location').value.trim(),
                    document.getElementById('rev-text').value.trim(),
                    document.getElementById('rev-date').value.trim()
                ];

                await postToGAS({ action: 'review_add', row });

                alert('Отзыв опубликован!');
                e.target.reset();
                loadAdminData();
            } catch (err) {
                if (err.message !== 'Unauthorized') alert('Ошибка: ' + err.message);
            } finally {
                btn.innerText = 'Опубликовать отзыв';
                btn.disabled = false;
            }
        });

        function getField(obj, keys) {
            for (const k of keys) {
                if (obj[k] !== undefined && String(obj[k]).trim() !== '') return String(obj[k]).trim();
            }
            const normMap = {};
            Object.keys(obj).forEach(ok => { normMap[ok.trim().toLowerCase()] = obj[ok]; });
            for (const k of keys) {
                const v = normMap[k.toLowerCase()];
                if (v !== undefined && String(v).trim() !== '') return String(v).trim();
            }
            return '';
        }

        async function loadAdminData() {
            try {
                const [toursRes, revRes] = await Promise.all([
                    fetch(`${GAS_API_URL}?action=tours&_t=${Date.now()}`),
                    fetch(`${GAS_API_URL}?action=reviews&_t=${Date.now()}`)
                ]);
                const tours = await toursRes.json();
                const reviews = await revRes.json();

                document.getElementById('admin-tours-list').innerHTML = tours.length
                    ? tours.map((t) => `
                        <div class="flex justify-between items-center p-3 bg-brand_bg rounded border border-brand_dark/10">
                            <div>
                                <p class="font-bold text-brand_dark">${t['Название'] || ''}</p>
                                <p class="text-xs">${t['Локация'] || ''} — ${t['Цена'] || ''}</p>
                            </div>
                            <button onclick="deleteItem('tour', ${t.row_index})" class="px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded hover:bg-red-200">Удалить</button>
                        </div>
                    `).join('')
                    : 'Туров пока нет';

                document.getElementById('admin-reviews-list').innerHTML = reviews.length
                    ? reviews.map((r) => {
                        const name = getField(r, ['Имя', 'Клиент', 'Автор', 'name']);
                        const country = getField(r, ['Страна', 'Локация', 'Куда летали', 'Направление', 'location', 'country']);
                        const revDate = getField(r, ['Дата', 'Дата написания', 'Дата отзыва', 'Дата поездки', 'date']);
                        const text = getField(r, ['Текст', 'Отзыв', 'Комментарий', 'text']);
                        const meta = [country, revDate].filter(Boolean).join(' • ');

                        return `
                        <div class="flex justify-between items-center p-3 bg-brand_bg rounded border border-brand_dark/10">
                            <div class="pr-4">
                                <p class="font-bold text-brand_dark">${name} ${meta ? `<span class="font-normal text-xs text-brand_dark/60">(${meta})</span>` : ''}</p>
                                <p class="text-xs line-clamp-1">${text}</p>
                            </div>
                            <button onclick="deleteItem('review', ${r.row_index})" class="px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded hover:bg-red-200 shrink-0">Удалить</button>
                        </div>`;
                    }).join('')
                    : 'Отзывов пока нет';
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteItem(type, rowIndex) {
            if (!confirm('Точно удалить эту запись с сайта?')) return;
            try {
                await postToGAS({ action: `${type}_delete`, row_index: rowIndex });
                loadAdminData();
            } catch (e) {
                if (e.message !== 'Unauthorized') alert('Ошибка при удалении: ' + e.message);
            }
        }
    </script>
</body>
</html>
